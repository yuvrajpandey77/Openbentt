server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Security headers. The Content-Security-Policy MUST stay identical to the
    # canonical policy in scripts/csp-policy.mjs (also injected as <meta> into
    # dist/index.html at build time); scripts/check-csp-artifacts.mjs fails the
    # build if they drift. frame-ancestors is header-only (ignored in <meta>).
    # WASM (BusyTeX, transformers.js) is covered by script-src 'wasm-unsafe-eval'
    # instead of a blanket omission — see the per-directive rationale in csp-policy.mjs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; worker-src 'self' blob:; child-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cache hashed Vite assets aggressively; never cache index.html (routes point at fresh bundle).
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|png|jpg|jpeg|svg|webp|mjs)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/research {
        proxy_pass http://127.0.0.1:8787/research;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 4m;
    }
}
