name: Release

# Push tag v* → build static zip + Electron for Linux, Windows, macOS; publish one GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Web zip + Linux AppImage/deb (single runner to avoid duplicate BusyTeX + Vite work for Linux).
  build-linux-web:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # If this log still shows "npx electron-builder", GitHub is running an old workflow file — push .github/workflows/release.yml from this repo.
      - name: Confirm release workflow uses npm scripts (not npx)
        run: grep -q "electron:pack:linux" .github/workflows/release.yml && grep -q "npm run electron:pack:linux" .github/workflows/release.yml

      # electron + electron-builder are devDependencies; NODE_ENV=development ensures npm ci installs them.
      - name: Install
        run: npm ci
        env:
          NODE_ENV: development

      - name: Verify Electron packages
        run: node -e "require('fs').accessSync('node_modules/electron/package.json'); require('fs').accessSync('node_modules/electron-builder/package.json'); console.log('electron', require('electron/package.json').version)"

      - name: Verify release version matches tag
        run: node scripts/verify-release-version.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Cache BusyTeX WASM (~175MB)
        id: busytex-cache
        uses: actions/cache@v4
        with:
          path: public/core/busytex
          key: busytex-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Download BusyTeX assets
        if: steps.busytex-cache.outputs.cache-hit != 'true'
        run: npm run download:busytex

      - name: Build web (Vite)
        run: npm run build
        env:
          NODE_ENV: production
          VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL }}

      - name: Bundle llama-server (Linux)
        run: npm run download:llama-server

      - name: Zip static dist
        run: (cd dist && zip -r "$GITHUB_WORKSPACE/openbentt-web-dist.zip" .)

      - name: Package Electron (Linux)
        run: npm run electron:pack:linux

      - name: Upload Linux + web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-web
          path: |
            openbentt-web-dist.zip
            release/

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Confirm release workflow uses npm scripts (not npx)
        run: Select-String -Path .github/workflows/release.yml -Pattern "electron:pack:win" | Select-Object -First 1

      - name: Install
        run: npm ci
        env:
          NODE_ENV: development

      - name: Verify Electron packages
        run: node -e "require('fs').accessSync('node_modules/electron/package.json'); require('fs').accessSync('node_modules/electron-builder/package.json'); console.log('electron', require('electron/package.json').version)"

      - name: Verify release version matches tag
        run: node scripts/verify-release-version.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Cache BusyTeX WASM
        id: busytex-cache
        uses: actions/cache@v4
        with:
          path: public/core/busytex
          key: busytex-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Download BusyTeX assets
        if: steps.busytex-cache.outputs.cache-hit != 'true'
        run: npm run download:busytex

      - name: Build web (Vite)
        run: npm run build
        env:
          NODE_ENV: production
          VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL }}

      - name: Bundle llama-server (Windows)
        run: npm run download:llama-server

      # Empty CSC_* from missing secrets is treated as a cert path ("… not a file").
      - name: Package Electron (Windows)
        shell: bash
        env:
          RAW_CSC_LINK: ${{ secrets.CSC_LINK }}
          RAW_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          RAW_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          RAW_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${RAW_CSC_LINK:-}" && -n "${RAW_CSC_KEY_PASSWORD:-}" ]]; then
            export CSC_LINK="$RAW_CSC_LINK"
            export CSC_KEY_PASSWORD="$RAW_CSC_KEY_PASSWORD"
          else
            unset CSC_LINK CSC_KEY_PASSWORD || true
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "Windows packaging unsigned (CSC secrets unset)"
          fi
          if [[ -n "${RAW_WIN_CSC_LINK:-}" && -n "${RAW_WIN_CSC_KEY_PASSWORD:-}" ]]; then
            export WIN_CSC_LINK="$RAW_WIN_CSC_LINK"
            export WIN_CSC_KEY_PASSWORD="$RAW_WIN_CSC_KEY_PASSWORD"
          else
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
          fi
          npm run electron:pack:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: release/

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Confirm release workflow uses npm scripts (not npx)
        run: grep -q "electron:pack:mac" .github/workflows/release.yml && grep -q "npm run electron:pack:mac" .github/workflows/release.yml

      - name: Install
        run: npm ci
        env:
          NODE_ENV: development

      - name: Verify Electron packages
        run: node -e "require('fs').accessSync('node_modules/electron/package.json'); require('fs').accessSync('node_modules/electron-builder/package.json'); console.log('electron', require('electron/package.json').version)"

      - name: Verify release version matches tag
        run: node scripts/verify-release-version.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Cache BusyTeX WASM
        id: busytex-cache
        uses: actions/cache@v4
        with:
          path: public/core/busytex
          key: busytex-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Download BusyTeX assets
        if: steps.busytex-cache.outputs.cache-hit != 'true'
        run: npm run download:busytex

      - name: Build web (Vite)
        run: npm run build
        env:
          NODE_ENV: production
          VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL }}

      - name: Bundle llama-server (macOS)
        run: npm run download:llama-server

      # Empty CSC_LINK="" makes electron-builder treat the workspace as a p12 → "not a file".
      - name: Package Electron (macOS)
        shell: bash
        env:
          RAW_CSC_LINK: ${{ secrets.CSC_LINK }}
          RAW_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          RAW_APPLE_ID: ${{ secrets.APPLE_ID }}
          RAW_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          RAW_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${RAW_CSC_LINK:-}" && -n "${RAW_CSC_KEY_PASSWORD:-}" ]]; then
            export CSC_LINK="$RAW_CSC_LINK"
            export CSC_KEY_PASSWORD="$RAW_CSC_KEY_PASSWORD"
            [[ -n "${RAW_APPLE_ID:-}" ]] && export APPLE_ID="$RAW_APPLE_ID"
            [[ -n "${RAW_APPLE_APP_SPECIFIC_PASSWORD:-}" ]] && export APPLE_APP_SPECIFIC_PASSWORD="$RAW_APPLE_APP_SPECIFIC_PASSWORD"
            [[ -n "${RAW_APPLE_TEAM_ID:-}" ]] && export APPLE_TEAM_ID="$RAW_APPLE_TEAM_ID"
            echo "macOS packaging with code signature"
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID || true
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "macOS packaging unsigned (CSC secrets unset)"
          fi
          npm run electron:pack:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: release/

  publish:
    needs: [build-linux-web, build-windows, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: combined
          pattern: release-assets-*
          merge-multiple: true

      - name: Flatten files for GitHub Release
        run: |
          mkdir -p upload
          find combined -type f \( \
            -name '*.zip' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.exe' -o \
            -name '*.dmg' -o \
            -name 'latest*.yml' \
          \) -exec cp -f {} upload/ \;
          ls -la upload/
          count=$(find upload -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.dmg' \) | wc -l)
          if [ "$count" -lt 1 ]; then
            echo "::error::No desktop installers in upload/. Do not create GitHub Releases manually — push a v* tag so CI builds all platforms."
            exit 1
          fi
          if ! ls upload/latest*.yml 1>/dev/null 2>&1; then
            echo "::warning::No latest*.yml auto-update manifests — desktop in-app updates may fail until electron-builder publishes them."
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: false
          body_path: docs/releases/${{ github.ref_name }}.md
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
